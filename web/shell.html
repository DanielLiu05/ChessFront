<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#090d12">
		<meta name="mobile-web-app-capable" content="yes">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background-color: #090d12;
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: white;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

#canvas {
	display: block;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	outline: none;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#safe-area-probe {
	position: fixed;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	visibility: hidden;
	pointer-events: none;
}

#play-overlay, #rotate-overlay {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	box-sizing: border-box;
	align-items: center;
	justify-content: center;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	background: rgba(9, 13, 18, 0.94);
	color: #e8f1ff;
	text-align: center;
	touch-action: none;
	-webkit-tap-highlight-color: transparent;
}

#play-overlay {
	cursor: pointer;
}

.overlay-card {
	max-width: 22rem;
	padding: 1.5rem;
}

.overlay-title {
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1.5rem;
	font-weight: 600;
	line-height: 1.2;
}

.overlay-detail {
	margin-top: 0.75rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1rem;
	line-height: 1.4;
}

.overlay-hint {
	margin-top: 1.25rem;
	color: #8fb3d9;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.8rem;
	line-height: 1.35;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	box-sizing: border-box;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="safe-area-probe"></div>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="play-overlay" role="button" tabindex="0" aria-label="Tap to play Chessfront">
			<div class="overlay-card">
				<div class="overlay-title">Chessfront</div>
				<div class="overlay-detail">Tap to play</div>
				<div class="overlay-hint">Portrait mode. Fullscreen and orientation lock are requested where the browser supports them.</div>
			</div>
		</div>

		<div id="rotate-overlay" role="status" aria-live="polite">
			<div class="overlay-card">
				<div class="overlay-title">Rotate to portrait</div>
				<div class="overlay-detail">Chessfront uses the portrait mobile layout. Rotate your device to continue.</div>
			</div>
		</div>

		<script>
(function () {
	const userAgent = navigator.userAgent;
	const mobileBrowser = /Android|iPhone|iPad|iPod/i.test(userAgent) ||
		(/Macintosh/.test(userAgent) && navigator.maxTouchPoints > 1);
	window.chessfrontIsMobileBrowser = mobileBrowser;
	if (mobileBrowser && window.devicePixelRatio > 2.0) {
		try {
			Object.defineProperty(window, 'devicePixelRatio', {
				configurable: true,
				get: function () { return 2.0; },
			});
		} catch (error) {
			// Some browsers disallow redefining devicePixelRatio; retaining the native value is safe.
		}
	}

	const probe = document.getElementById('safe-area-probe');

	function numberOrZero(value) {
		const parsed = Number.parseFloat(value);
		return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
	}

	function readSafeInsets() {
		const override = window.chessfrontSafeInsetsOverride;
		if (override && typeof override === 'object') {
			return {
				left: numberOrZero(override.left),
				top: numberOrZero(override.top),
				right: numberOrZero(override.right),
				bottom: numberOrZero(override.bottom),
			};
		}
		const style = window.getComputedStyle(probe);
		return {
			left: numberOrZero(style.paddingLeft),
			top: numberOrZero(style.paddingTop),
			right: numberOrZero(style.paddingRight),
			bottom: numberOrZero(style.paddingBottom),
		};
	}

	window.chessfrontGetSafeInsets = readSafeInsets;
	window.chessfrontSafeInsets = readSafeInsets();
	window.addEventListener('resize', function () {
		window.chessfrontSafeInsets = readSafeInsets();
	}, { passive: true });
	window.addEventListener('orientationchange', function () {
		window.chessfrontSafeInsets = readSafeInsets();
	}, { passive: true });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', function () {
			window.chessfrontSafeInsets = readSafeInsets();
		}, { passive: true });
	}
}());

(function () {
	const playOverlay = document.getElementById('play-overlay');
	const rotateOverlay = document.getElementById('rotate-overlay');
	let ready = false;
	let started = false;

	function isMobileBrowser() {
		return !!window.chessfrontIsMobileBrowser;
	}

	function isLandscape() {
		return window.innerWidth > window.innerHeight;
	}

	function updateOverlays() {
		const mobile = isMobileBrowser();
		if (!mobile) {
			playOverlay.style.display = 'none';
			rotateOverlay.style.display = 'none';
			return;
		}
		const landscape = isLandscape();
		rotateOverlay.style.display = landscape ? 'flex' : 'none';
		playOverlay.style.display = (!landscape && ready && !started) ? 'flex' : 'none';
	}

	function requestFullscreenAndPortraitLock() {
		const element = document.documentElement;
		const request = element.requestFullscreen || element.webkitRequestFullscreen;
		if (request) {
			try {
				const result = request.call(element, { navigationUI: 'hide' });
				if (result && result.catch) {
					result.catch(function () {});
				}
			} catch (error) {
				// Fullscreen is best-effort; the browser may reject it.
			}
		}
		if (screen.orientation && screen.orientation.lock) {
			try {
				const lock = screen.orientation.lock('portrait');
				if (lock && lock.catch) {
					lock.catch(function () {});
				}
			} catch (error) {
				// Orientation lock is best-effort; the rotate overlay is the fallback.
			}
		}
	}

	function beginPlay() {
		if (!isMobileBrowser() || started) {
			return;
		}
		started = true;
		requestFullscreenAndPortraitLock();
		updateOverlays();
		window.setTimeout(updateOverlays, 350);
	}

	playOverlay.addEventListener('click', beginPlay);
	playOverlay.addEventListener('keydown', function (event) {
		if (event.key === 'Enter' || event.key === ' ') {
			event.preventDefault();
			beginPlay();
		}
	});
	window.chessfrontReadyMs = null;
	window.chessfrontMarkReady = function () {
		ready = true;
		window.chessfrontReadyMs = performance.now();
		updateOverlays();
	};
	window.addEventListener('resize', updateOverlays, { passive: true });
	window.addEventListener('orientationchange', updateOverlays, { passive: true });
	document.addEventListener('fullscreenchange', updateOverlays);
	document.addEventListener('webkitfullscreenchange', updateOverlays);
	updateOverlays();
}());
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
